let vx=Math.cos(cameraYaw)*x-Math.sin(cameraYaw)*y,vz=-Math.sin(cameraYaw)*x-Math.cos(cameraYaw)*y;let speed=(run?5:2.2)*magnitude;let nx=THREE.MathUtils.clamp(player.position.x+vx*speed*dt,-88,88),nz=THREE.MathUtils.clamp(player.position.z+vz*speed*dt,-88,88);player.position.x=nx;player.position.z=nz;let desired=Math.atan2(-vx,-vz);heading+=Math.atan2(Math.sin(desired-heading),Math.cos(desired-heading))*Math.min(1,dt*13);setAction(run?'run':'walk')}else setAction('idle');vy-=16*dt;vertical=Math.max(0,vertical+vy*dt);if(vertical===0){vy=0;grounded=true}player.position.y=vertical;player.rotation.y=heading;mixer?.update(dt);saveTime+=dt;if(saveTime>9){persist();saveTime=0}let n=npc.filter(n=>!n.dead&&distance(n)<5).sort((a,b)=>distance(a)-distance(b))[0];$('prompt').textContent=n?'ACT · '+n.name:state.stage>=2&&!state.extraThefts.Tarin&&near(20,24,8)?'ACT · Tarin’s home':state.stage===4&&near(-4,-3,7)?'ACT · Stick and stone':'Joystick = move · Swipe = look only · ACT near people'}for(let i=particles.length-1;i>=0;i--){let a=particles[i];a.life-=dt;a.m.position.addScaledVector(a.v,dt);a.v.y-=4*dt;a.m.scale.setScalar(Math.max(.01,a.life));if(a.life<=0){scene.remove(a.m);a.m.geometry.dispose();a.m.material.dispose();particles.splice(i,1)}}let dist=5.6;target.set(player.position.x+Math.sin(cameraYaw)*dist*Math.cos(cameraPitch),player.position.y+2+Math.sin(cameraPitch)*dist,player.position.z+Math.cos(cameraYaw)*dist*Math.cos(cameraPitch));camera.position.lerp(target,Math.min(1,dt*9));camera.lookAt(player.position.x,player.position.y+1.35,player.position.z);renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
